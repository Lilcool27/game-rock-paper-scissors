<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحدي بطاقات: حجرة ورقة مقص 🃏</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 600px;
        }
        .status-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #334155;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
        }
        .zone {
            margin: 20px 0;
            padding: 15px;
            background: #0f172a;
            border-radius: 10px;
            min-height: 120px;
        }
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .card {
            width: 70px;
            height: 100px;
            background: #e2e8f0;
            color: #0f172a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid #94a3b8;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 5px 15px rgba(0,255,255,0.4);
        }
        .card.computer {
            background: #64748b;
            color: #ffffff;
            cursor: default;
        }
        .card.computer:hover {
            transform: none;
            box-shadow: none;
        }
        .result-box {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 30px;
            color: #38bdf8;
        }
        .battle-arena {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 24px;
        }
        .restart-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
        .restart-btn:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🃏 لعبة بطاقات: حجرة ورقة مقص 🃏</h2>
    <p style="color: #94a3b8;">الفائز في الجولة يسلب بطاقة الخاسر! تنتهي اللعبة بنفاد بطاقات أحد الطرفين.</p>

    <!-- لوحة الحالة -->
    <div class="status-board">
        <div>بطاقاتك الكلية: <span id="player-count">6</span></div>
        <div>بطاقات الخصم الكلية: <span id="comp-count">6</span></div>
    </div>

    <!-- منطقة بطاقات الخصم (مخفية الأنوع) -->
    <div class="zone">
        <h3>يد الخصم (الكمبيوتر)</h3>
        <div class="cards-container" id="computer-hand"></div>
    </div>

    <!-- ساحة القتال المباشر -->
    <div class="battle-arena">
        <div id="player-choice">👤 ؟</div>
        <div style="color: #64748b;">ضد</div>
        <div id="comp-choice">🤖 ؟</div>
    </div>

    <!-- صندوق النتيجة -->
    <div class="result-box" id="round-result">اختر بطاقة لبدء التحدي!</div>

    <!-- منطقة بطاقات اللاعب -->
    <div class="zone" style="background: #1e1b4b; border: 1px solid #4338ca;">
        <h3>بطاقاتك المتاحة (اختر واحدة لتلعب بها)</h3>
        <div class="cards-container" id="player-hand"></div>
    </div>

    <button class="restart-btn" id="restart-btn" onclick="initGame()">اللعب مجدداً 🔄</button>
</div>

<script>
// أنواع البطاقات المتاحة باللعبة
const CARD_TYPES = [
    { name: 'حجرة', emoji: '🪨', beats: 'مقص' },
    { name: 'ورقة', emoji: '📄', beats: 'حجرة' },
    { name: 'مقص', emoji: '✂️', beats: 'ورقة' }
];

let playerHand = [];
let computerHand = [];

// دالة بدء اللعبة وتوزيع البطاقات عشوائياً (6 لكل طرف)
function initGame() {
    playerHand = [];
    computerHand = [];
    document.getElementById('restart-btn').style.display = 'none';
    document.getElementById('round-result').innerText = 'اختر بطاقة لبدء التحدي!';
    document.getElementById('player-choice').innerText = '👤 ؟';
    document.getElementById('comp-choice').innerText = '🤖 ؟';

    // توزيع 6 بطاقات عشوائية للاعب و 6 للكمبيوتر
    for(let i=0; i<6; i++) {
        playerHand.push(CARD_TYPES[Math.floor(Math.random() * 3)]);
        computerHand.push(CARD_TYPES[Math.floor(Math.random() * 3)]);
    }

    renderHands();
}

// دالة تحديث شاشة البطاقات والعدادات
function renderHands() {
    document.getElementById('player-count').innerText = playerHand.length;
    document.getElementById('comp-count').innerText = computerHand.length;

    // عرض بطاقات اللاعب
    const playerHandDiv = document.getElementById('player-hand');
    playerHandDiv.innerHTML = '';
    playerHand.forEach((card, index) => {
        const cardBox = document.createElement('div');
        cardBox.className = 'card';
        cardBox.innerHTML = `<span>${card.emoji}</span><span>${card.name}</span>`;
        cardBox.onclick = () => playRound(index);
        playerHandDiv.appendChild(cardBox);
    });

    // عرض بطاقات الكمبيوتر (مخفية الرموز لعدم الغش)
    const compHandDiv = document.getElementById('computer-hand');
    compHandDiv.innerHTML = '';
    computerHand.forEach(() => {
        const cardBox = document.createElement('div');
        cardBox.className = 'card computer';
        cardBox.innerHTML = `<span>🃏</span><span>؟</span>`;
        compHandDiv.appendChild(cardBox);
    });

    // فحص نهاية اللعبة بنفاد البطاقات
    checkGameOver();
}

// دالة لعب الجولة عند اختيار بطاقة
function playRound(playerCardIndex) {
    if(playerHand.length === 0 || computerHand.length === 0) return;

    // بطاقة اللاعب المختارة
    const pCard = playerHand[playerCardIndex];
    
    // الكمبيوتر يختار بطاقة عشوائية من يده المتاحة
    const compCardIndex = Math.floor(Math.random() * computerHand.length);
    const cCard = computerHand[compCardIndex];

    // عرض الاختيارات في ساحة المعركة
    document.getElementById('player-choice').innerText = `👤 ${pCard.emoji} ${pCard.name}`;
    document.getElementById('comp-choice').innerText = `🤖 ${cCard.emoji} ${cCard.name}`;

    const resultText = document.getElementById('round-result');

    // منطق الفوز والخسارة والسلب
    if (pCard.name === cCard.name) {
        // حالة التعادل: لا أحد يأخذ شيئاً
        resultText.innerHTML = "🤝 تعادل! لم يخسر أحد أي بطاقة.";
        resultText.style.color = "#94a3b8";
    } 
    else if (pCard.beats === cCard.name) {
        // اللاعب فاز: يأخذ بطاقة الكمبيوتر ويضيفها ليده
        resultText.innerHTML = `🎉 فزت بالجولة! سحبت بطاقة [${cCard.name}] من الخصم!`;
        resultText.style.color = "#4ade80";
        
        playerHand.push(cCard); // إضافة بطاقة الخصم للاعب
        computerHand.splice(compCardIndex, 1); // حذفها من الخصم
    } 
    else {
        // الكمبيوتر فاز: يأخذ بطاقة اللاعب ويضيفها ليده
        resultText.innerHTML = `😢 خسرت الجولة! الخصم سلب منك بطاقة [${pCard.name}]!`;
        resultText.style.color = "#f87171";
        
        computerHand.push(pCard); // إضافة بطاقتك للخصم
        playerHand.splice(playerCardIndex, 1); // حذفها من يدك
    }

    // إعادة تحديث الأيدي والعدادات
    renderHands();
}

// دالة فحص نهاية اللعبة
function checkGameOver() {
    const resultText = document.getElementById('round-result');
    
    if (playerHand.length === 0) {
        resultText.innerHTML = "💥 انتهت اللعبة! نفدت جميع بطاقاتك. الخصم انتصر وسلب كل كروتك! 🤖🏆";
        resultText.style.color = "#ef4444";
        document.getElementById('restart-btn').style.display = 'block';
    } 
    else if (computerHand.length === 0) {
        resultText.innerHTML = "👑 انتصار ساحق! لقد سلبت جميع بطاقات الخصم ودمرته تماماً! 👤🏆";
        resultText.style.color = "#22c55e";
        document.getElementById('restart-btn').style.display = 'block';
    }
}

// تشغيل اللعبة فور فتح الصفحة
initGame();
</script>
</body>
</html>
